name: ${STACK_PREFIX:-fatboy}-migrations
services:
  migrate:
    image: ${API_IMAGE:-fatboy-api}:${API_VERSION:-local}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: [pnpm, db:migrate]
    networks: [shared]
networks:
  shared:
    external: true
    name: ${DEPLOY_NETWORK:-fatboy-production}
