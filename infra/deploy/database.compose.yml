name: ${STACK_PREFIX:-fatboy}-database
services:
  database:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: fatboy
      POSTGRES_DB: fatboy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      shared:
        aliases: [fatboy-db]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fatboy -d fatboy]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  shared:
    external: true
    name: ${DEPLOY_NETWORK:-fatboy-production}
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:-fatboy-postgres}
